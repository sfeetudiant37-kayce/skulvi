[project]
name = "skullvi-talent-engine"
version = "1.0.0"
description = "Candidate intake and review MVP for the SKULLVI HCP challenge"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
